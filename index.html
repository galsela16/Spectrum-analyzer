<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>אנלייזר ספקטרום - Transfer Function</title>
  <style>
    /* עיצוב הממשק והחלונית */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    .modal {
      background: #1e1e24;
      border: 1px solid #333;
      border-radius: 8px;
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #tfPanel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      max-height: 85vh;
      overflow-y: auto;
      padding: 16px;
    }

    #tfCanvas {
      width: 100% !important;
      height: 160px !important;
      position: relative !important;
      flex-shrink: 0;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #tfGeqList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-top: 10px;
      z-index: 10;
    }

    .sub-title {
      font-size: 13px;
      color: #ddd;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .eqGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .eqRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }

    .eqRow.boost .g { color: #4caf50; font-weight: bold; }
    .eqRow.cut .g { color: #f44336; font-weight: bold; }
    .eqRow .f { color: #aaa; }

    .btn-close {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      align-self: center;
      margin-top: 10px;
    }
    .btn-close:hover { background: #444; }
  </style>
</head>
<body>

  <!-- חלונית המדידה -->
  <div class="modal">
    <div id="tfPanel">
      <canvas id="tfCanvas"></canvas>
      <div id="tfGeqList"></div>
      <button class="btn-close" onclick="closeModal()">סגור</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. תדרים תקניים ל-31 פסים (Graphic EQ)
    // ==========================================
    const GEQ = [
      20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 
      800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000
    ];

    // אובייקט תוצאת מוק (דוגמה לנתוני מדידה)
    window.tfResult = {
      corr: [
        -2.5, -3.0, -1.5, 0.0, 1.2, 2.5, 3.8, 4.0, 2.1, 0.5, 
        -1.0, -2.4, -4.1, -3.5, -2.0, 0.0, 1.5, 2.0, 1.8, 0.5, 
        -0.5, -1.2, -2.0, -3.1, -2.5, -1.0, 0.0, 0.5, 1.0, 1.2, 0.0
      ]
    };

    // ==========================================
    // 2. פונקציית רינדור הרשימה והגרף (Render)
    // ==========================================
    function renderTFList() {
      const box = document.getElementById('tfGeqList');
      const cv2 = document.getElementById('tfCanvas');
      
      if (!box || !cv2) return;
      
      if (!window.tfResult || !window.tfResult.corr) { 
        box.innerHTML = '<div class="sub-title">ממתין לנתוני מדידה...</div>'; 
        cv2.style.display = 'none'; 
        return; 
      }
      
      cv2.style.display = 'block'; 
      drawGEQ(cv2, GEQ, window.tfResult.corr);
      
      window.eqCurveData = { 
        freqs: GEQ.slice(), 
        corr: window.tfResult.corr.slice() 
      };
      
      let html = '<div class="sub-title">ערכי תיקון לגרפיק-EQ (31 פסים):</div>';
      html += '<div class="eqGrid">';
      
      let rows = [];
      
      for (let k = 0; k < GEQ.length; k++) {
        const v = window.tfResult.corr[k];
        if (v == null || isNaN(v)) continue;
        
        const fStr = GEQ[k] >= 1000 ? (GEQ[k] / 1000) + 'k' : GEQ[k];
        const cls = v < 0 ? 'cut' : (v > 0 ? 'boost' : '');
        const sign = v > 0 ? '+' : '';
        
        rows.push(`
          <div class="eqRow ${cls}">
            <span class="f">${fStr}</span>
            <span class="g">${sign}${v.toFixed(1)}dB</span>
          </div>
        `);
      }
      
      if (rows.length > 0) {
        html += rows.join('') + '</div>';
      } else {
        html += '<div class="sub-title">אות רפרנס חלש מדי לחישוב תיקון</div></div>';
      }
      
      box.innerHTML = html;
    }

    // ==========================================
    // 3. ציור הגרף על ה-Canvas (drawGEQ)
    // ==========================================
    function drawGEQ(canvas, freqs, corrData) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth;
      const h = canvas.height = canvas.clientHeight;
      
      ctx.clearRect(0, 0, w, h);
      
      const centerY = h / 2;
      
      // ציור קו אפס (0dB)
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.moveTo(0, centerY);
      ctx.lineTo(w, centerY);
      ctx.stroke();
      
      if (!corrData || corrData.length === 0) return;
      
      // ציור העקומה
      ctx.beginPath();
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 2;
      
      const stepX = w / (freqs.length - 1);
      const maxDB = 12;
      
      for (let i = 0; i < freqs.length; i++) {
        const val = Math.max(-maxDB, Math.min(maxDB, corrData[i] || 0));
        const x = i * stepX;
        const y = centerY - (val / maxDB) * (h / 2 - 10);
        
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      
      // מילוי צבע ירוק תחת העקומה
      ctx.lineTo(w, centerY);
      ctx.lineTo(0, centerY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(76, 175, 80, 0.15)';
      ctx.fill();
    }

    function closeModal() {
      document.querySelector('.modal').style.display = 'none';
    }

    // הרצה ראשונית של הטעינה
    window.onload = renderTFList;
  </script>
</body>
</html>
